spring.application.name=patrimoine-touristique

# ---- Base de donnees H2 (fichier local ./data/patrimoine.mv.db) ----
spring.datasource.url=jdbc:h2:file:./data/patrimoine;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ---- Upload de fichiers (photos/videos des sites) ----
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=uploads

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

server.port=8080
