<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mes réservations</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <h1>Mes réservations</h1>
    <div class="card">
        <table>
            <tr><th>Site</th><th>Date</th><th>Statut</th><th></th></tr>
            <tr th:each="r : ${reservations}">
                <td th:text="${r.visite.site.nom}">Site</td>
                <td th:text="${#temporals.format(r.visite.dateHeureDebut, 'dd/MM/yyyy HH:mm')}">Date</td>
                <td>
                    <span class="badge" th:if="${r.statut.name() == 'CONFIRME'}" th:text="${r.statut}"></span>
                    <span class="badge danger" th:if="${r.statut.name() == 'ANNULE'}" th:text="${r.statut}"></span>
                </td>
                <td>
                    <a th:href="@{'/reservations/' + ${r.id} + '/confirmation'}" class="btn small secondary">Voir le ticket</a>
                    <form th:if="${r.statut.name() == 'CONFIRME'}" th:action="@{'/reservations/' + ${r.id} + '/annuler'}"
                          method="post" class="inline" onsubmit="return confirm('Annuler cette réservation ?');">
                        <button type="submit" class="btn small danger">Annuler</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(reservations)}"><td colspan="4">Aucune réservation.</td></tr>
        </table>
    </div>

    <div class="card">
        <h2>Laisser un avis sur une visite terminée</h2>
        <div th:each="r : ${reservations}" th:if="${r.statut.name() == 'CONFIRME'}" style="border-top:1px solid #e1e6e3; padding:14px 0;">
            <p><strong th:text="${r.visite.site.nom}">Site</strong> —
               <span th:text="${#temporals.format(r.visite.dateHeureDebut, 'dd/MM/yyyy')}"></span></p>
            <form th:action="@{'/avis/nouveau/reservation/' + ${r.id}}" method="post">
                <label>Note</label>
                <select name="note" required>
                    <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                    <option value="4">⭐⭐⭐⭐ (4)</option>
                    <option value="3">⭐⭐⭐ (3)</option>
                    <option value="2">⭐⭐ (2)</option>
                    <option value="1">⭐ (1)</option>
                </select>
                <label>Commentaire</label>
                <textarea name="commentaire" required></textarea>
                <button type="submit" class="btn small" style="margin-top:8px;">Publier l'avis</button>
            </form>
        </div>
        <p th:if="${#lists.isEmpty(reservations)}">Aucune visite confirmée pour le moment.</p>
    </div>
</div>
</body>
</html>
