<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${guide.nomComplet}">Guide</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1 th:text="${guide.nomComplet}">Nom du guide</h1>
        <p th:text="${fiche.specialite}">Spécialité</p>
        <p th:text="${fiche.biographie}">Bio</p>
        <p class="stars" th:if="${fiche.noteMoyenne > 0}">⭐ <span th:text="${#numbers.formatDecimal(fiche.noteMoyenne,1,1)}"></span>/5</p>
    </div>

    <div class="card">
        <h2>Avis</h2>
        <p sec:authorize="hasRole('TOURIST')" style="font-size:0.9rem; color:#607b73;">
            Pour laisser un avis sur ce guide, rendez-vous dans <a th:href="@{/reservations}">Mes réservations</a>
            après une visite confirmée avec lui.
        </p>

        <div th:each="a : ${avisListe}" style="border-top:1px solid #e1e6e3; padding:10px 0; margin-top:12px;">
            <p class="stars" th:text="${'⭐'.repeat(a.note)}"></p>
            <p th:text="${a.commentaire}"></p>
            <p th:if="${a.reponse}" style="background:#f4f6f5; padding:8px; border-radius:6px;">
                <strong>Réponse :</strong> <span th:text="${a.reponse}"></span>
            </p>
        </div>
        <p th:if="${#lists.isEmpty(avisListe)}">Aucun avis pour le moment.</p>
    </div>
</div>
</body>
</html>
